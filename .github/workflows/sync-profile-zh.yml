name: Sync Chinese profile README

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: sync-profile-zh-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_MODELS_MODEL: openai/gpt-4.1

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Generate and validate the Chinese README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/sync_profile_readme.py \
            --source README.md \
            --target README.zh-CN.md \
            --rules .github/profile-translation-rules.md

      - name: Check that this run is still current
        id: freshness
        run: |
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "A newer main revision exists; skipping this stale result."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the synchronized README
        if: steps.freshness.outputs.stale != 'true'
        run: |
          if git diff --quiet -- README.zh-CN.md; then
            echo "README.zh-CN.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.zh-CN.md
          git commit -m "chore(profile): sync Chinese README"
          git push origin HEAD:main
