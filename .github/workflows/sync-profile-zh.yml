name: Sync Chinese profile README

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-profile-zh-${{ github.ref }}
  cancel-in-progress: true

env:
  DEEPSEEK_MODEL: deepseek-v4-flash

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Generate and validate the Chinese README
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 .github/scripts/sync_profile_readme.py \
            --source README.md \
            --target README.zh-CN.md \
            --rules .github/profile-translation-rules.md

      - name: Publish the synchronized README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.zh-CN.md; then
            echo "README.zh-CN.md is already up to date."
            exit 0
          fi

          LOCAL_SOURCE_BLOB="$(git rev-parse HEAD:README.md)"
          LOCAL_TARGET_BLOB="$(git rev-parse HEAD:README.zh-CN.md)"
          ENCODED_CONTENT="$(base64 -w 0 README.zh-CN.md)"
          MUTATION='mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }'

          for ATTEMPT in 1 2 3; do
            git fetch --no-tags origin main
            REMOTE_HEAD="$(git rev-parse origin/main)"
            REMOTE_SOURCE_BLOB="$(git rev-parse origin/main:README.md)"
            REMOTE_TARGET_BLOB="$(git rev-parse origin/main:README.zh-CN.md)"

            if [ "$LOCAL_SOURCE_BLOB" != "$REMOTE_SOURCE_BLOB" ]; then
              echo "README.md changed during this run; a newer run will synchronize it."
              exit 0
            fi
            if [ "$LOCAL_TARGET_BLOB" != "$REMOTE_TARGET_BLOB" ]; then
              echo "README.zh-CN.md changed during this run; refusing to overwrite it."
              exit 1
            fi

            if jq -n \
              --arg query "$MUTATION" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg expectedHeadOid "$REMOTE_HEAD" \
              --arg contents "$ENCODED_CONTENT" \
              '{
                query: $query,
                variables: {
                  input: {
                    branch: {
                      repositoryNameWithOwner: $repository,
                      branchName: "main"
                    },
                    expectedHeadOid: $expectedHeadOid,
                    message: {
                      headline: "chore(profile): sync Chinese README"
                    },
                    fileChanges: {
                      additions: [{
                        path: "README.zh-CN.md",
                        contents: $contents
                      }]
                    }
                  }
                }
              }' | gh api graphql --input -; then
              exit 0
            fi

            if [ "$ATTEMPT" -eq 3 ]; then
              echo "Branch head kept changing; unable to publish safely."
              exit 1
            fi
          done
