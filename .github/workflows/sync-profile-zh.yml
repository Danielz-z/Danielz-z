name: Sync Chinese profile README

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: sync-profile-zh-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_MODELS_MODEL: openai/gpt-4.1

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Generate and validate the Chinese README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/sync_profile_readme.py \
            --source README.md \
            --target README.zh-CN.md \
            --rules .github/profile-translation-rules.md

      - name: Publish the synchronized README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.zh-CN.md; then
            echo "README.zh-CN.md is already up to date."
            exit 0
          fi

          LOCAL_SOURCE_BLOB="$(git rev-parse HEAD:README.md)"
          git fetch --no-tags origin main
          REMOTE_SOURCE_BLOB="$(git rev-parse origin/main:README.md)"
          if [ "$LOCAL_SOURCE_BLOB" != "$REMOTE_SOURCE_BLOB" ]; then
            echo "README.md changed during this run; a newer run will synchronize it."
            exit 0
          fi

          TARGET_BLOB="$(git rev-parse origin/main:README.zh-CN.md)"
          ENCODED_CONTENT="$(base64 -w 0 README.zh-CN.md)"
          jq -n \
            --arg message "chore(profile): sync Chinese README" \
            --arg content "$ENCODED_CONTENT" \
            --arg sha "$TARGET_BLOB" \
            --arg branch "main" \
            '{message: $message, content: $content, sha: $sha, branch: $branch}' \
            | gh api --method PUT \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/contents/README.zh-CN.md" \
                --input -
